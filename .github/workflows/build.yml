name: Build with Gradle

on:
  push:
    branches: 'main'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  libraries:
    name: "Build core"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x ./gradlew
      - name: Build core
        run: ./gradlew :core:build

      - name: Upload core jars
        uses: actions/upload-artifact@v7
        with:
          name: polycompose-core
          path: core/build/libs/*.jar
          if-no-files-found: error

  build:
    name: "Build ${{ matrix.version }}"
    needs: libraries
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.9", "1.21.1", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1", "26.2", "26.3"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x ./gradlew
      - name: Build Stonecutter version
        run: |
          ./gradlew ":${{ matrix.version }}-${{ matrix.version == '1.8.9' && 'ornithe' || 'fabric' }}:build"

      - name: Resolve built mod jar
        id: mod-jar
        run: |
          mapfile -t jars < <(find "versions/${{ matrix.version }}-${{ matrix.version == '1.8.9' && 'ornithe' || 'fabric' }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)

          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one non-sources jar, found %s:\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload built mod jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.mod-jar.outputs.path }}
          archive: false

  bundle:
    name: "Bundle built jars"
    needs: build
    if: ${{ !cancelled() }}
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*.jar"
          path: jars
          merge-multiple: true

      - name: Upload bundled mod jars
        uses: actions/upload-artifact@v7
        with:
          name: polycompose-mod-jars
          path: jars/*.jar
